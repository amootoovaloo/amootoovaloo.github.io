<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{ page.redirect_to | prepend: site.baseurl | prepend: site.url }}">
  <meta http-equiv="refresh" content="0; url={{ page.redirect_to | prepend: site.baseurl }}">
  <script>
    (function () {
      var to = {{ page.redirect_to | prepend: site.baseurl | jsonify }};
      {% if page.redirect_hash_param %}// Carry a #fragment over as a query parameter (e.g. #research -> ?tag=research).
      if (location.hash.length > 1) to += '?{{ page.redirect_hash_param }}=' + encodeURIComponent(location.hash.slice(1));
      {% endif %}location.replace(to);
    })();
  </script>
</head>
<body>
  <p>This page has moved to <a href="{{ page.redirect_to | prepend: site.baseurl }}">{{ page.redirect_to | prepend: site.baseurl }}</a>.</p>
</body>
</html>
