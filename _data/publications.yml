  bibtex: |-
    @article{Heavens_2023,
      title = {Extreme data compression for Bayesian model comparison},
      volume = {2023},
      ISSN = {1475-7516},
      url = {http://dx.doi.org/10.1088/1475-7516/2023/11/048},
      DOI = {10.1088/1475-7516/2023/11/048},
      number = {11},
      journal = {Journal of Cosmology and Astroparticle Physics},
      publisher = {IOP Publishing},
      author = {Heavens, Alan F. and Mootoovaloo, Arrykrishna and Trotta, Roberto and Sellentin, Elena},
      year = {2023},
      month = Nov,
      pages = {048}
    }
  year: 2023
  abstract: |-
    We develop extreme data compression for use in Bayesian model comparison via the MOPED algorithm, as well as more general score compression. We find that Bayes factors from data compressed with the MOPED algorithm are identical to those from their uncompressed datasets when the models are linear and the errors Gaussian. In other nonlinear cases, whether nested or not, we find negligible differences in the Bayes factors, and show this explicitly for the Pantheon-SH0ES supernova dataset. We also investigate the sampling properties of the Bayesian Evidence as a frequentist statistic, and find that extreme data compression reduces the sampling variance of the Evidence, but has no impact on the sampling distribution of Bayes factors. Since model comparison can be a very computationally-intensive task, MOPED extreme data compression may present significant advantages in computational time.

- title: |-
    Analytical marginalisation over photometric redshift uncertainties in cosmic shear analyses
  authors: |-
    Jaime Ruiz-Zapatero, Boryana Hadzhiyska, David Alonso, Pedro G. Ferreira, Carlos García-García, <strong class="me">Arrykrishna Mootoovaloo</strong>
  venue: "MNRAS"
  links:
    - label: Journal
      url: "https://academic.oup.com/mnras/article/522/4/5037/7136163?login=false"
    - label: arXiv
      url: "https://arxiv.org/abs/2301.11978"
  bibtex: |-
    @misc{ruizzapatero2023analyticalmarginalisationphotometricredshift,
          title={Analytical marginalisation over photometric redshift uncertainties in cosmic shear analyses}, 
          author={Jaime Ruiz-Zapatero and Boryana Hadzhiyska and David Alonso and Pedro G. Ferreira and Carlos García-García and Arrykrishna Mootoovaloo},
          year={2023},
          eprint={2301.11978},
          archivePrefix={arXiv},
          primaryClass={astro-ph.CO},
          doi={https://doi.org/10.1093/mnras/stad1192},
          url={https://arxiv.org/abs/2301.11978}, 
    }
  year: 2023
  abstract: |-
    As the statistical power of imaging surveys grows, it is crucial to account for all systematic uncertainties. This is normally done by constructing a model of these uncertainties and then marginalizing over the additional model parameters. The resulting high dimensionality of the total parameter spaces makes inferring the cosmological parameters significantly more costly using traditional Monte-Carlo sampling methods. A particularly relevant example is the redshift distribution, $p(z)$, of the source samples, which may require tens of parameters to describe fully. However, relatively tight priors can be usually placed on these parameters through calibration of the associated systematics. In this paper we show, quantitatively, that a linearisation of the theoretical prediction with respect to these calibratable systematic parameters allows us to analytically marginalise over these extra parameters, leading to a factor $\sim 30$ reduction in the time needed for parameter inference, while accurately recovering the same posterior distributions for the cosmological parameters that would be obtained through a full numerical marginalisation over $160\; p(z)$ parameters. We demonstrate that this is feasible not only with current data and current achievable calibration priors but also for future Stage-IV datasets.

- title: |-
    Kernel-Based Emulator for the 3D Matter Power Spectrum from CLASS
  authors: |-
    <strong class="me">Arrykrishna Mootoovaloo</strong>, Andrew Jaffe, Alan Heavens, Florent Leclercq
  venue: "Astronomy and Computing"
  links:
    - label: Journal
      url: "https://doi.org/10.1016/j.ascom.2021.100508"
