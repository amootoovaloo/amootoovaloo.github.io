    - label: Docs
      url: "https://emupk.readthedocs.io/"
  bibtex: |-
    @article{Mootoovaloo_2022,
      title = {Kernel-based emulator for the 3D matter power spectrum from CLASS},
      volume = {38},
      ISSN = {2213-1337},
      url = {http://dx.doi.org/10.1016/j.ascom.2021.100508},
      DOI = {10.1016/j.ascom.2021.100508},
      journal = {Astronomy and Computing},
      publisher = {Elsevier BV},
      author = {Mootoovaloo, A. and Jaffe, A.H. and Heavens, A.F. and Leclercq, F.},
      year = {2022},
      month = Jan,
      pages = {100508}
    }
  selected: true
  year: 2022
  abstract: |-
    The 3D matter power spectrum, $P_{\delta}(k,z)$ is a fundamental quantity in the analysis of cosmological data such as large-scale structure, 21cm observations, and weak lensing. Existing computer models (Boltzmann codes) such as CLASS can provide it at the expense of immoderate computational cost. In this paper, we propose a fast Bayesian method to generate the 3D matter power spectrum, for a given set of wavenumbers, $k$ and redshifts, $z$. Our code allows one to calculate the following quantities: the linear matter power spectrum at a given redshift (the default is set to 0); the non-linear 3D matter power spectrum with/without baryon feedback; the weak lensing power spectrum. The gradient of the 3D matter power spectrum with respect to the input cosmological parameters is also returned and this is useful for Hamiltonian Monte Carlo samplers. The derivatives are also useful for Fisher matrix calculations. In our application, the emulator is accurate when evaluated at a set of cosmological parameters, drawn from the prior, with the fractional uncertainty, $\Delta P_{\delta}/P_{\delta}$ centered on 0. It is also $\sim 300$ times faster compared to CLASS, hence making the emulator amenable to sampling cosmological and nuisance parameters in a Monte Carlo routine. In addition, once the 3D matter power spectrum is calculated, it can be used with a specific redshift distribution, $n(z)$ to calculate the weak lensing and intrinsic alignment power spectra, which can then be used to derive constraints on cosmological parameters in a weak lensing data analysis problem. The software ($\texttt{emuPK}$) can be trained with any set of points and is distributed on Github, and comes with a pre-trained set of Gaussian Process (GP) models, based on 1000 Latin Hypercube (LH) samples, which follow roughly the current priors for current weak lensing analyses.

- title: |-
    Fast Approximate Model for the 3D Matter Power Spectrum
  authors: |-
    <strong class="me">Arrykrishna Mootoovaloo</strong>, Andrew Jaffe, Alan Heavens, Florent Leclercq
  venue: "NeurIPS 2021"
  year: 2021
  abstract: |-
    Many Bayesian inference problems in cosmology involve complex models. Despite the fact that these models have been meticulously designed, they can lead to intractable likelihood and each forward simulation itself can be computationally expensive, thus making the inverse problem of learning the model parameters a challenging task. In this paper, we develop an approximate model for the 3D matter power spectrum, $P_{\delta}(k,z)$, which is a central quantity in a weak lensing analysis. An important output of this approximate model, often referred to as surrogate model or emulator, are the first and second derivatives with respect to the input cosmological parameters. Without the emulator, the calculation of the derivatives requires multiple calls of the simulator, that is, the accurate Boltzmann solver, CLASS. We illustrate the application of the emulator in the calculation of different weak lensing and intrinsic alignment power spectra and we also demonstrate its performance on a toy simulated weak lensing dataset.

- title: |-
    Data Augmentation in a Hierarchical-Based Classification scheme for Variable Stars
  authors: |-
    Zafiirah Hosenie, Robert Lyon, Benjamin Stappers, <strong class="me">Arrykrishna Mootoovaloo</strong>, Vanessa McBrides
  venue: "NeurIPS 2020"
  year: 2020
  abstract: |-
    The accurate automated classification of variable stars into their respective sub-types is difficult. Machine learning based solutions often fall foul of the imbalanced learning problem, which causes poor generalisation performance in practice, especially on rare variable star sub-types. We attempted to overcome such deficiencies via the development of a hierarchical machine learning classifier. This ‘algorithm-level’ approach to tackling imbalance, yielded promising results on Catalina Real-Time Survey (CRTS) data. We attempt to further improve hierarchical classification performance by applying ‘data-level’ approaches to directly augment the training data so that they better describe under-represented classes. We apply and report results for three data augmentation methods in particular: Randomly Augmented Sampled Light curves from magnitude Error (RASLE), augmenting light curves with Gaussian Process modelling (GpFit) and the Synthetic Minority Over-sampling Technique (SMOTE). When combining the ‘algorithm-level’ (i.e. the hierarchical scheme) together with the ‘data-level’ approach, we further improve variable star classification accuracy by 1-4%. We found that a higher classification rate is obtained when using GpFit in the hierarchical model.

- title: |-
    Parameter Inference for Weak Lensing using Gaussian Processes and MOPED
  authors: |-
    <strong class="me">Arrykrishna Mootoovaloo</strong>, Alan Heavens, Andrew Jaffe, Florent Leclercq
  venue: "MNRAS"
  links:
    - label: Journal
      url: "https://doi.org/10.1093/mnras/staa2102"
    - label: arXiv
      url: "https://arxiv.org/abs/2005.06551"
    - label: Code
      url: "https://github.com/Harry45/gp_emulator"
  bibtex: |-
    @article{Mootoovaloo_2020,
      title = {Parameter inference for weak lensing using Gaussian Processes and MOPED},
      volume = {497},
      ISSN = {1365-2966},
      url = {http://dx.doi.org/10.1093/mnras/staa2102},
      DOI = {10.1093/mnras/staa2102},
      number = {2},
      journal = {Monthly Notices of the Royal Astronomical Society},
      publisher = {Oxford University Press (OUP)},
      author = {Mootoovaloo, Arrykrishna and Heavens, Alan F and Jaffe, Andrew H and Leclercq, Florent},
      year = {2020},
      month = July,
      pages = {2213–2226}
    }
  selected: true
  year: 2020
  abstract: |-
    In this paper, we propose a Gaussian Process (GP) emulator for the calculation of a) tomographic weak lensing band-power spectra, and b) coefficients of summary data massively compressed with the MOPED algorithm.  In the former case cosmological parameter inference is accelerated by a factor of $\sim 10$-$30$ compared to explicit calls to the Boltzmann solver CLASS when applied to KiDS-450 weak lensing data.  Much larger gains will come with future data, where with MOPED compression, the speed up can be up to a factor of $\sim 10^3$ when the common Limber approximation is used. Furthermore, the GP opens up the possibility of dropping the Limber approximation, without which the theoretical calculations may be unfeasibly slow. A potential advantage of GPs is that an error on the emulated function can be computed and this uncertainty incorporated into the likelihood.  If speed is of the essence, then the mean of the Gaussian Process can be used and the uncertainty ignored. We compute the Kullback-Leibler divergence between the emulator likelihood and the CLASS likelihood, and on the basis of this and from analysing the uncertainties on the parameters, we find that in this case, the inclusion of the GP uncertainty does not justify the extra computational expense in the test application. For future weak lensing surveys such as Euclid and Legacy Survey of Space and Time (LSST), the number of summary statistics will be large, up to $\sim 10^{4}$.   The speed of MOPED is determined by the number of parameters, not the number of summary data, so the gains are very large.  In the non-Limber case, the speed-up can be a factor of $\sim 10^5$, provided that a fast way to compute the theoretical MOPED coefficients is available.  The GP presented here provides such a fast mechanism and enables MOPED to be employed.

- title: |-
    Gaussian Processes and MOPED Compression for Weak Lensing
  authors: |-
    <strong class="me">Arrykrishna Mootoovaloo</strong>, Alan Heavens, Andrew Jaffe, Florent Leclercq
  venue: "ICLR 2020"
  links:
    - label: Workshop
      url: "https://iclr2020-fsai.github.io/FSAI/"
    - label: Video
      url: "https://slideslive.com/38926202/gaussian-processes-emulator-and-moped-for-weak-lensing"
    - label: PDF
      url: "https://drive.google.com/file/d/1p9EY869IWnQhV2bAC9XQg1Q_HK_7z4VY/view"
    - label: Code
      url: "https://github.com/Harry45/gp_emulator"
  year: 2020
  abstract: |-
    In this paper, we propose a Gaussian Process (GP) emulator for tomographic weak lensing band power spectra, which speeds up cosmological parameter inference by a factor of $\sim$ 12 − 30 when applied to the KiDS-450 data. The emulator is built upon 8 parameters (6 cosmological and 2 systematic) using 1000 Latin Hypercube training samples. Since the prediction from the emulator is Gaussian distributed, we can also include the theoretical uncertainty in the likelihood function using the predictive uncertainty to marginalise over the latent function. Including the GP uncertainty is more demanding since it requires an $\mathcal{O}(N^{2})$ operation, for train each band power at every step in the MCMC compared to $\mathcal{O}(N_{\textrm{train}})$ for the mean alone, where $N_{\textrm{train}}$ is the number of training points in the emulator. If we use the exact solver, that is CLASS, each likelihood computation takes ∼ 0.65 seconds while each likelihood evaluation with the mean and uncertainty of the GP is $\sim$ 0.03 and $\sim$ 0.09 seconds respectively. The algorithm can be sped further when using MOPED compression algorithm which eliminates the $\mathcal{O}(N^{3})$ cost in the likelihood evaluation, where $N$ is the number of data points. Finally, with the emulator, it is realistic to drop the Limber approximation and train on the very slow but accurate full integrals.

- title: |-
