- title: |-
    KiDS+VIKING-450 cosmology with Bayesian hierarchical model redshift distributions
  authors: |-
    George T. Kyriacou, <strong class="me">Arrykrishna Mootoovaloo</strong>, Alan F. Heavens, Andrew H. Jaffe, Florent Leclercq, Konrad Kuijken
  venue: "MNRAS"
  links:
    - label: arXiv
      url: "https://arxiv.org/abs/2605.15078"
  bibtex: |-
    @misc{kyriacou2026kidsviking450cosmologybayesianhierarchical,
          title={KiDS+VIKING-450 cosmology with Bayesian hierarchical model redshift distributions}, 
          author={George T. Kyriacou and Arrykrishna Mootoovaloo and Alan F. Heavens and Andrew H. Jaffe and Florent Leclercq and Konrad Kuijken},
          year={2026},
          eprint={2605.15078},
          archivePrefix={arXiv},
          primaryClass={astro-ph.CO},
          url={https://arxiv.org/abs/2605.15078}, 
    }
  year: 2026
  abstract: |-
    Tomographic redshift distributions from photometric data are crucial ingredients in cosmic shear analysis, since they are required for the theoretical calculation of the signal based on the redshift distribution of the galaxies where the shear field is sampled. In this paper, we develop as a proof of concept Leistedt et al.'s template-based Bayesian Hierarchical Model framework into an application to weak lensing data by sampling the redshift distributions of the galaxies in the KiDS+VIKING-450 survey. We also use a principal component analysis to provide a set of representative templates drawn from a large superset. For computational tractability, subsets of $10^5$ galaxies are chosen to determine the redshift distributions, and we test the sensitivity of the cosmological inference to the subset chosen, finding it to be subdominant compared to the statistical error. We marginalise over the inferred redshift distributions and find that the Bayesian method increases the clustering parameter compared with previous studies, alleviating the $S_8$ tension with Planck, where $S_{8}\equiv\sigma_{8}\sqrt{\Omega_{\textrm{m}}/0.3}=0.756\pm 0.039$, assuming flat $\Lambda$CDM. The tension with Planck for this survey is reduced from $2.3\sigma$ to $1.9\sigma$. We also infer a value for the matter density, $\Omega_{\textrm{m}}=0.31\pm 0.10$.

- title: |-
    emuflow: Normalising Flows for Joint Cosmological Analysis
  authors: |-
    <strong class="me">A. Mootoovaloo</strong>, C. García-García, D. Alonso, J. Ruiz-Zapatero
  venue: "MNRAS · NeurIPS 2024"
  links:
    - label: arXiv
      url: "https://arxiv.org/abs/2409.01407"
  bibtex: |-
    @misc{mootoovaloo2024mathttemuflownormalisingflowsjoint,
          title={$\mathtt{emuflow}$: Normalising Flows for Joint Cosmological Analysis}, 
          author={Arrykrishna Mootoovaloo and Carlos García-García and David Alonso and Jaime Ruiz-Zapatero},
          year={2024},
          eprint={2409.01407},
          archivePrefix={arXiv},
          primaryClass={astro-ph.CO},
          url={https://arxiv.org/abs/2409.01407}, 
    }
  selected: true
  year: 2024
  abstract: |-
    Given the growth in the variety and precision of astronomical datasets of interest for cosmology, the best cosmological constraints are invariably obtained by combining data from different experiments. At the likelihood level, one complication in doing so is the need to marginalise over large-dimensional parameter models describing the data of each experiment. These include both the relatively small number of cosmological parameters of interest and a large number of "nuisance" parameters. Sampling over the joint parameter space for multiple experiments can thus become a very computationally expensive operation. This can be significantly simplified if one could sample directly from the marginal cosmological posterior distribution of preceding experiments, depending only on the common set of cosmological parameters. In this paper, we show that this can be achieved by emulating marginal posterior distributions via normalising flows. The resulting trained normalising flow models can be used to efficiently combine cosmological constraints from independent datasets without increasing the dimensionality of the parameter space under study. We show that the method is able to accurately describe the posterior distribution of real cosmological datasets, as well as the joint distribution of different datasets, even when significant tension exists between experiments. The resulting joint constraints can be obtained in a fraction of the time it would take to combine the same datasets at the level of their likelihoods. We construct normalising flow models for a set of public cosmological datasets of general interests and make them available, together with the software used to train them, and to exploit them in cosmological parameter inference.

- title: |-
    Assessment of Gradient-Based Samplers in Standard Cosmological Likelihoods
  authors: |-
    <strong class="me">A. Mootoovaloo</strong>, J. Ruiz-Zapatero, C. García-García, D. Alonso
  venue: "MNRAS · NeurIPS 2024"
  links:
    - label: arXiv
      url: "https://arxiv.org/abs/2406.04725"
  bibtex: |-
    @misc{mootoovaloo2024assessmentgradientbasedsamplersstandard,
          title={Assessment of Gradient-Based Samplers in Standard Cosmological Likelihoods}, 
          author={Arrykrishna Mootoovaloo and Jaime Ruiz-Zapatero and Carlos García-García and David Alonso},
          year={2024},
          eprint={2406.04725},
          archivePrefix={arXiv},
          primaryClass={astro-ph.IM},
          url={https://arxiv.org/abs/2406.04725}, 
    }
  selected: true
  year: 2024
  abstract: |-
    We assess the usefulness of gradient-based samplers, such as the No-U-Turn Sampler (NUTS), by comparison with traditional Metropolis-Hastings algorithms, in tomographic $3\times 2$ point analyses. Specifically, we use the DES Year 1 data and a simulated future LSST-like survey as representative examples of these studies, containing a significant number of nuisance parameters (20 and 32, respectively) that affect the performance of rejection-based samplers. To do so, we implement a differentiable forward model using JAX-COSMO (<a href="https://doi.org/10.21105/astro.2302.05163">Campagne et al. 2023</a>), and we use it to derive parameter constraints from both datasets using the NUTS algorithm as implemented in §4, and the Metropolis-Hastings algorithm as implemented in Cobaya (<a href="https://doi.org/10.1103/PhysRevD.87.103529">Lewis 2013</a>). When quantified in terms of the number of effective number of samples taken per likelihood evaluation, we find a relative efficiency gain of $\mathcal{O}(10)$ in favour of NUTS. However, this efficiency is reduced to a factor $\sim 2$ when quantified in terms of computational time, since we find the cost of the gradient computation (needed by NUTS) relative to the likelihood to be $\sim 4.5$ times larger for both experiments. We validate these results making use of analytical multi-variate distributions (a multivariate Gaussian and a Rosenbrock distribution) with increasing dimensionality. Based on these results, we conclude that gradient-based samplers such as NUTS can be leveraged to sample high dimensional parameter spaces in Cosmology, although the efficiency improvement is relatively mild for moderate $(\mathcal{O}(50))$ dimension numbers, typical of tomographic large-scale structure analyses.

- title: |-
    LimberJack.jl: auto-differentiable methods for angular power spectra analyses
  authors: |-
    J. Ruiz-Zapatero, D. Alonso, C. García-García, A. Nicola, <strong class="me">A. Mootoovaloo</strong>, J. M. Sullivan, M. Bonici, P. G. Ferreira
  venue: "The Open Journal of Astrophysics"
  links:
    - label: Journal
      url: "https://astro.theoj.org/article/92854-limberjack-jl-auto-differentiable-methods-for-angular-power-spectra-analyses"
    - label: arXiv
      url: "https://arxiv.org/abs/2310.08306"
  bibtex: |-
    @misc{ruizzapatero2024limberjackjlautodifferentiablemethodsangular,
          title={LimberJack.jl: auto-differentiable methods for angular power spectra analyses}, 
          author={J. Ruiz-Zapatero and D. Alonso and C. García-García and A. Nicola and A. Mootoovaloo and J. M. Sullivan and M. Bonici and P. G. Ferreira},
          year={2024},
          eprint={2310.08306},
          archivePrefix={arXiv},
          primaryClass={astro-ph.CO},
          doi={https://doi.org/10.21105/astro.2310.08306},
          url={https://arxiv.org/abs/2310.08306}, 
    }
  year: 2023
  abstract: |-
    We present LimberJack.jl, a fully auto-differentiable code for cosmological analyses of 2 point auto- and cross-correlation measurements from galaxy clustering, CMB lensing and weak lensing data written in Julia. Using Julia's auto-differentiation ecosystem, LimberJack.jl can obtain gradients for its outputs up to an order of magnitude faster than traditional finite difference methods. This makes LimberJack.jl greatly synergistic with gradient-based sampling methods, such as Hamiltonian Monte Carlo, capable of efficiently exploring parameter spaces with hundreds of dimensions. We first prove LimberJack.jl's reliability by reanalysing the DES Y1 $3\times 2$-point data. We then showcase its capabilities by using a $\mathcal{O}(100)$ parameters Gaussian Process to reconstruct the cosmic growth from a combination of DES Y1 galaxy clustering and weak lensing data, eBOSS QSO's, CMB lensing and redshift-space distortions. Our Gaussian process reconstruction of the growth factor is statistically consistent with the $\Lambda$CDM Planck 2018 prediction at all redshifts. Moreover, we show that the addition of RSD data is extremely beneficial to this type of analysis, reducing the uncertainty in the reconstructed growth factor by $20\%$ on average across redshift. LimberJack.jl is a fully open-source project available on Julia's general repository of packages and GitHub.

- title: |-
    Extreme data compression for Bayesian model comparison
  authors: |-
    Alan F. Heavens, <strong class="me">Arrykrishna Mootoovaloo</strong>, Roberto Trotta, Elena Sellentin
  venue: "JCAP"
  links:
