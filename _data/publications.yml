    The accurate automated classification of variable stars into their respective sub-types is difficult. Machine learning based solutions often fall foul of the imbalanced learning problem, which causes poor generalisation performance in practice, especially on rare variable star sub-types. In previous work, we attempted to overcome such deficiencies via the development of a hierarchical machine learning classifier. This 'algorithm-level' approach to tackling imbalance, yielded promising results on Catalina Real-Time Survey (CRTS) data, outperforming the binary and multi-class classification schemes previously applied in this area. In this work, we attempt to further improve hierarchical classification performance by applying 'data-level' approaches to directly augment the training data so that they better describe under-represented classes. We apply and report results for three data augmentation methods in particular: Randomly Augmented Sampled Light curves from magnitude Error (𝚁𝙰𝚂𝙻𝙴), augmenting light curves with Gaussian Process modelling (𝙶𝚙𝙵𝚒𝚝) and the Synthetic Minority Over-sampling Technique (𝚂𝙼𝙾𝚃𝙴). When combining the 'algorithm-level' (i.e. the hierarchical scheme) together with the 'data-level' approach, we further improve variable star classification accuracy by 1-4%. We found that a higher classification rate is obtained when using 𝙶𝚙𝙵𝚒𝚝 in the hierarchical model. Further improvement of the metric scores requires a better standard set of correctly identified variable stars and, perhaps enhanced features are needed.

- title: |-
    Comparing Multi-class, Binary and Hierarchical Machine Learning Classification schemes for variable stars
  authors: |-
    Zafiirah Hosenie, Robert Lyon, Benjamin Stappers, <strong class="me">Arrykrishna Mootoovaloo</strong>
  venue: "MNRAS"
  links:
    - label: Journal
      url: "https://doi.org/10.1093/mnras/stz1999"
    - label: arXiv
      url: "https://arxiv.org/abs/1907.08189"
  bibtex: |-
    @article{Hosenie_2019,
      title = {Comparing Multiclass, Binary, and Hierarchical Machine Learning Classification schemes for variable stars},
      volume = {488},
      ISSN = {1365-2966},
      url = {http://dx.doi.org/10.1093/mnras/stz1999},
      DOI = {10.1093/mnras/stz1999},
      number = {4},
      journal = {Monthly Notices of the Royal Astronomical Society},
      publisher = {Oxford University Press (OUP)},
      author = {Hosenie, Zafiirah and Lyon, Robert J and Stappers, Benjamin W and Mootoovaloo, Arrykrishna},
      year = {2019},
      month = July,
      pages = {4858–4872}
    }
  year: 2019
  abstract: |-
    Upcoming synoptic surveys are set to generate an unprecedented amount of data. This requires an automatic framework that can quickly and efficiently provide classification labels for several new object classification challenges. Using data describing 11 types of variable stars from the Catalina Real-Time Transient Surveys (CRTS), we illustrate how to capture the most important information from computed features and describe detailed methods of how to robustly use Information Theory for feature selection and evaluation. We apply three Machine Learning (ML) algorithms and demonstrate how to optimize these classifiers via cross-validation techniques. For the CRTS dataset, we find that the Random Forest (RF) classifier performs best in terms of balanced-accuracy and geometric means. We demonstrate substantially improved classification results by converting the multi-class problem into a binary classification task, achieving a balanced-accuracy rate of $\sim$99 per cent for the classification of $\delta$-Scuti and Anomalous Cepheids (ACEP). Additionally, we describe how classification performance can be improved via converting a 'flat-multi-class' problem into a hierarchical taxonomy. We develop a new hierarchical structure and propose a new set of classification features, enabling the accurate identification of subtypes of cepheids, RR Lyrae and eclipsing binary stars in CRTS data.

- title: |-
    Marginal Likelihoods from Monte Carlo Markov Chains
  authors: |-
    Alan Heavens, Yabebal Fantaye, <strong class="me">Arrykrishna Mootoovaloo</strong>, Hans Eggers, Zafiirah Hosenie, Steve Kroon, Elena Sellentin
  venue: "Preprint"
